[package]
name = "rust_html_server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
ron = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "full"] }
tower-http = { version = "0.6.11", features = ["fs"] }
