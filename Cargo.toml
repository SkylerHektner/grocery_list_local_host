[package]
name = "rust_html_server"
version = "0.1.0"
edition = "2024"
description = "Keyboard-first grocery list builder served on the home LAN"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "rust_html_server"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6.11", features = ["fs"] }

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3"
tower = { version = "0.5.3", features = ["util"] }
