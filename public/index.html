<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f6f2e9">
  <!-- A stored dark theme (js/theme.js) applies before first paint, so there is no light flash. -->
  <script>try { if (localStorage.getItem('grocery-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch {}</script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Grocery list</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 3h20a3 3 0 0 1 3 3v14l-9 9H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z' fill='%23f4cf5d'/%3E%3Cpath d='M20 29v-6a3 3 0 0 1 3-3h6' fill='%23e0b23e'/%3E%3Cpath d='M9 12.5l3.5 3.5L21 8' fill='none' stroke='%232f6f4e' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="shell" class="shell">
    <header class="app-header">
      <div class="app-header-inner">
        <a class="brand" href="#/list" data-testid="app-title" aria-label="Grocery list, go to the list">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <path class="brand-note" d="M6 3h20a3 3 0 0 1 3 3v14l-9 9H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z"/>
            <path class="brand-fold" d="M20 29v-6a3 3 0 0 1 3-3h6"/>
            <path class="brand-check" d="M9 12.5l3.5 3.5L21 8"/>
          </svg>
          <span class="brand-name">Grocery list</span>
        </a>

        <nav class="tabs" aria-label="Views" data-testid="tabs">
          <a class="tab" href="#/list" data-view="list" data-testid="tab-list" aria-keyshortcuts="Alt+1" title="List (Alt+1)">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01"/></svg>
            <span class="tab-label">List</span>
          </a>
          <a class="tab" href="#/recipes" data-view="recipes" data-testid="tab-recipes" aria-keyshortcuts="Alt+2" title="Recipes (Alt+2)">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 4H18v13H6.5A2.5 2.5 0 0 0 4 19.5V6.5A2.5 2.5 0 0 1 6.5 4zM4 19.5A2.5 2.5 0 0 0 6.5 22H18v-5M8.5 8.5h5"/></svg>
            <span class="tab-label">Recipes</span>
          </a>
          <a class="tab" href="#/items" data-view="items" data-testid="tab-items" aria-keyshortcuts="Alt+3" title="Items (Alt+3)">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12.3V4.5a1 1 0 0 1 1-1h7.8l8.2 8.2a1.5 1.5 0 0 1 0 2.1l-6.7 6.7a1.5 1.5 0 0 1-2.1 0zM8 8h.01"/></svg>
            <span class="tab-label">Items</span>
          </a>
          <a class="tab" href="#/categories" data-view="categories" data-testid="tab-categories" aria-keyshortcuts="Alt+4" title="Store order (Alt+4)">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM18 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM8 19h8.5a3.5 3.5 0 0 0 0-7h-9a3.5 3.5 0 0 1 0-7H16"/></svg>
            <span class="tab-label">Store order</span>
          </a>
        </nav>

        <div class="header-actions">
          <span class="sync" data-testid="sync-status" data-state="connecting" role="status">
            <span class="sync-dot" aria-hidden="true"></span><span class="sync-label">Connecting…</span>
          </span>
          <button type="button" class="btn btn-ghost btn-icon theme-toggle" data-testid="theme-toggle" aria-label="Dark mode" aria-pressed="false" title="Switch to dark mode">
            <svg class="icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
            <svg class="icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 2.5v2M12 19.5v2M4.5 12h-2M21.5 12h-2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
          </button>
          <button type="button" class="btn btn-ghost btn-icon" data-testid="shortcuts-button" aria-label="Keyboard shortcuts" aria-keyshortcuts="?" title="Keyboard shortcuts (?)">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5H4A1.5 1.5 0 0 1 2.5 16V8A1.5 1.5 0 0 1 4 6.5zM6.5 10h.01M10 10h.01M13.5 10h.01M17.5 10h.01M8 14h8"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main id="view-root" class="app-main" data-testid="view-root" tabindex="-1"></main>
  </div>

  <div class="toast-region" data-testid="toasts" aria-live="polite"></div>
</body>
</html>
