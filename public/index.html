<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Grocery List Builder</title>
        <link rel="stylesheet" href="/style.css" />
    </head>
    <body>
        <div class="container">
            <h1>Grocery List 🛒</h1>
            <button id="add-item-btn">Add Item</button>

            <div class="items-container">
                <ul id="items-list">
                    <li>Loading...</li>
                </ul>
            </div>
        </div>

        <!-- Modal Background -->
        <div id="modal-backdrop" class="modal-backdrop hidden">
            <!-- Modal Content -->
            <div class="modal">
                <h2>Enter item name</h2>
                <input type="text" id="item-input" placeholder="Item name..." />
                <div class="modal-actions">
                    <button id="cancel-btn" class="btn-secondary">
                        Cancel
                    </button>
                    <button id="submit-btn" class="btn-primary">Submit</button>
                </div>
            </div>
        </div>

        <script src="/script.js"></script>
    </body>
</html>
