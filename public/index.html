<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Grocery List Builder</title>
        <link rel="stylesheet" href="/style.css?v=2" />
    </head>
    <body>
        <div class="container">
            <h1>Grocery App 🛒</h1>

            <div class="main-content">
                <!-- Left Column: Items Catalog -->
                <div class="items-column">
                    <h2>Available Items</h2>
                    <button id="new-item-btn">Add New Item</button>
                    <button id="clear-grocery-list-btn">Clear Grocery List</button>
                    <div class="items-container">
                        <ul id="items-list" aria-label="Available items">
                            <li>Loading...</li>
                        </ul>
                    </div>
                </div>

                <!-- Right Column: Recipes -->
                <div class="recipes-column">
                    <h2>Recipes</h2>
                    <button id="new-recipe-btn">Add New Recipe</button>
                    <div class="recipes-container">
                        <ul id="recipes-list" aria-label="Available recipes">
                            <li>Loading...</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- New Item Modal Background -->
        <div id="new-item-modal-backdrop" class="modal-backdrop hidden">
            <!-- Modal Content -->
            <div class="modal">
                <h2>Enter item details</h2>
                <input type="text" id="item-input" placeholder="Item name..." />
                <select id="item-category">
                    <option value="" disabled selected>
                        Select a category...
                    </option>
                </select>
                <div class="modal-actions">
                    <button id="new-item-cancel-btn" class="btn-secondary">
                        Cancel
                    </button>
                    <button id="new-item-submit-btn" class="btn-primary">
                        Submit
                    </button>
                </div>
            </div>
        </div>

        <!-- Edit Item Modal Background -->
        <div id="edit-item-modal-backdrop" class="modal-backdrop hidden">
            <!-- Modal Content -->
            <div class="modal">
                <h2>Edit item details</h2>
                <input
                    type="text"
                    id="edit-item-input"
                    placeholder="Item name..."
                />
                <select id="edit-item-category">
                    <option value="" disabled selected>
                        Select a category...
                    </option>
                </select>
                <div class="modal-actions">
                    <button id="edit-item-cancel-btn" class="btn-secondary">
                        Cancel
                    </button>
                    <button id="edit-item-submit-btn" class="btn-primary">
                        Update
                    </button>
                </div>
            </div>
        </div>

        <!-- Delete Item Modal Background -->
        <div id="delete-item-modal-backdrop" class="modal-backdrop hidden">
            <!-- Modal Content -->
            <div class="modal">
                <h2>Confirm Deletion</h2>
                <p>
                    Are you sure you want to delete
                    <strong id="delete-item-name-display"></strong>?
                </p>
                <div class="modal-actions">
                    <button id="delete-item-cancel-btn" class="btn-secondary">
                        Cancel
                    </button>
                    <button id="delete-item-submit-btn" class="btn-danger">
                        Delete
                    </button>
                </div>
            </div>
        </div>

        <!-- New Recipe Modal Background -->
        <div id="new-recipe-modal-backdrop" class="modal-backdrop hidden">
            <!-- Modal Content -->
            <div class="modal">
                <h2>Create New Recipe</h2>
                <input type="text" id="recipe-name-input" placeholder="Recipe name..." />
                <div class="recipe-items-section">
                    <label for="recipe-item-select">Add Items:</label>
                    <div class="recipe-item-input-group">
                        <select id="recipe-item-select">
                            <option value="" disabled selected>
                                Select an item...
                            </option>
                        </select>
                        <button id="recipe-add-item-btn" class="btn-secondary">Add</button>
                    </div>
                    <button id="recipe-new-item-btn" class="btn-secondary btn-small">
                        + New Item
                    </button>
                    <ul id="recipe-items-list" aria-label="Recipe items">
                    </ul>
                </div>
                <div class="modal-actions">
                    <button id="new-recipe-cancel-btn" class="btn-secondary">
                        Cancel
                    </button>
                    <button id="new-recipe-submit-btn" class="btn-primary">
                        Create Recipe
                    </button>
                </div>
            </div>
        </div>

        <!-- Edit Recipe Modal Background -->
        <div id="edit-recipe-modal-backdrop" class="modal-backdrop hidden">
            <!-- Modal Content -->
            <div class="modal">
                <h2>Edit Recipe</h2>
                <input type="text" id="edit-recipe-name-input" placeholder="Recipe name..." />
                <div class="recipe-items-section">
                    <label for="edit-recipe-item-select">Add Items:</label>
                    <div class="recipe-item-input-group">
                        <select id="edit-recipe-item-select">
                            <option value="" disabled selected>
                                Select an item...
                            </option>
                        </select>
                        <button id="edit-recipe-add-item-btn" class="btn-secondary">Add</button>
                    </div>
                    <ul id="edit-recipe-items-list" aria-label="Edit recipe items">
                    </ul>
                </div>
                <div class="modal-actions">
                    <button id="edit-recipe-cancel-btn" class="btn-secondary">
                        Cancel
                    </button>
                    <button id="edit-recipe-submit-btn" class="btn-primary">
                        Update Recipe
                    </button>
                </div>
            </div>
        </div>

        <!-- Delete Recipe Modal Background -->
        <div id="delete-recipe-modal-backdrop" class="modal-backdrop hidden">
            <!-- Modal Content -->
            <div class="modal">
                <h2>Confirm Deletion</h2>
                <p>
                    Are you sure you want to delete the recipe
                    <strong id="delete-recipe-name-display"></strong>?
                </p>
                <div class="modal-actions">
                    <button id="delete-recipe-cancel-btn" class="btn-secondary">
                        Cancel
                    </button>
                    <button id="delete-recipe-submit-btn" class="btn-danger">
                        Delete
                    </button>
                </div>
            </div>
        </div>

        <script type="module" src="/script/init.js"></script>
    </body>
</html>
